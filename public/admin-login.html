<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartWaste Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #0f172a; color: #e2e8f0; min-height: 100vh; display: grid; place-items: center; }
    .card { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 16px; }
    .form-control { background: #0f172a; color: #e2e8f0; border: 2px solid #334155; border-radius: 10px; }
    .form-control:focus { border-color: #10b981; box-shadow: 0 0 0 0.2rem rgba(16,185,129,.2); }
    .btn-primary { background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 10px; }
    .text-muted { color: #94a3b8 !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow p-4">
          <div class="text-center mb-3">
            <h3 class="fw-bold">SmartWaste Admin</h3>
            <p class="text-muted mb-0">Administrator Access</p>
          </div>
          <div id="alert" class="alert alert-danger d-none" role="alert"></div>
          <form id="adminLoginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="admin@domain.com" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" placeholder="••••••••" required />
                <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password">Show</button>
              </div>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label" for="rememberMe">Remember me on this device</label>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary" id="signInBtn">
                <span class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true" id="loadingSpinner"></span>
                <span id="signInText">Sign in</span>
              </button>
            </div>
          </form>
          <div class="text-center mt-3">
            <small class="text-muted">This area is restricted to authorized administrators.</small>
            <div class="mt-2"><a href="/login.html" class="link-light text-decoration-none">Back to user login</a></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api-service.js"></script>
  <script>
    (function() {
      const form = document.getElementById('adminLoginForm');
      const alertBox = document.getElementById('alert');
      const signInBtn = document.getElementById('signInBtn');
      const signInText = document.getElementById('signInText');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const togglePasswordBtn = document.getElementById('togglePassword');

      function showError(message) {
        alertBox.textContent = message || 'Login failed';
        alertBox.classList.remove('d-none');
      }

      function hideError() {
        alertBox.classList.add('d-none');
      }

      function setLoading(isLoading) {
        if (!signInBtn) return;
        if (isLoading) {
          signInBtn.disabled = true;
          loadingSpinner.classList.remove('d-none');
          signInText.textContent = 'Signing in...';
        } else {
          signInBtn.disabled = false;
          loadingSpinner.classList.add('d-none');
          signInText.textContent = 'Sign in';
        }
      }

      // Password visibility toggle
      if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener('click', () => {
          const pwd = document.getElementById('password');
          if (!pwd) return;
          const isHidden = pwd.type === 'password';
          pwd.type = isHidden ? 'text' : 'password';
          togglePasswordBtn.textContent = isHidden ? 'Hide' : 'Show';
        });
      }

      // Redirect already authenticated admin
      async function precheckAdminSession() {
        try {
          const token = localStorage.getItem('adminAuthToken') || localStorage.getItem('authToken');
          if (!token) return;
          const me = await window.apiService.getCurrentUser();
          const role = me && me.data && me.data.role;
          if (role === 'admin') {
            window.location.href = '/dashboard-admin.html';
          } else {
            // Clear wrong-role token
            localStorage.removeItem('adminAuthToken');
            localStorage.removeItem('authToken');
            localStorage.removeItem('user');
          }
        } catch (_) {
          // ignore and stay on login
        }
      }

      // Basic client-side validation
      function validate(email, password) {
        if (!email || !password) {
          showError('Please fill in all fields');
          return false;
        }
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          showError('Please enter a valid email address');
          return false;
        }
        if (password.length < 6) {
          showError('Password must be at least 6 characters');
          return false;
        }
        return true;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!validate(email, password)) return;
        setLoading(true);
        try {
          const res = await window.apiService.adminLogin({ email, password });
          const token = (res && res.data && res.data.token) || res.token;
          if (!token) throw new Error('No token received');
          // Ensure role is admin
          const role = (res && res.data && res.data.role) || (res && res.role);
          if (role !== 'admin') {
            // Clear any accidental token
            window.apiService.clearAdminSession(false);
            throw new Error('Admin access required');
          }
          // Remember me: default on; if unchecked, store in sessionStorage additionally to allow easy cleanup
          const remember = document.getElementById('rememberMe').checked;
          if (!remember) {
            try {
              sessionStorage.setItem('adminAuthToken', token);
            } catch (_) {}
          }
          // Redirect to admin dashboard
          window.location.href = '/dashboard-admin.html';
        } catch (err) {
          showError(err.message || 'Invalid credentials');
        } finally {
          setLoading(false);
        }
      });

      // Enter key support is implicit; also run precheck
      precheckAdminSession();
    })();
  </script>
</body>
</html>
